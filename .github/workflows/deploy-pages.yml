name: Deploy Flat Finder

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
      - assets/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Build site
        run: npm run build
        working-directory: web
        env:
          VITE_BASE_PATH: /flat-finder-vadodara/
          VITE_DATA_PATH: /flat-finder-vadodara/web/public/data/
      - name: Publish files for branch-based Pages
        run: |
          cp web/dist/index.html index.html
          mkdir -p assets
          cp web/dist/assets/* assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html assets
          if ! git diff --cached --quiet; then
            git commit -m "Update GitHub Pages build"
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
